<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gatito Guardián</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section class="hero">
      <svg id="cat" class="cat" viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M38 70 L46 22 L72 50 Z" fill="var(--fur)"/>
        <path d="M122 70 L114 22 L88 50 Z" fill="var(--fur)"/>
        <path d="M46 62 L50 34 L64 50 Z" fill="#F2A6A0"/>
        <path d="M114 62 L110 34 L96 50 Z" fill="#F2A6A0"/>
        <ellipse cx="80" cy="84" rx="50" ry="42" fill="var(--fur-light)"/>
        <path d="M70 46 q2 10 0 18 M80 44 v20 M90 46 q-2 10 0 18" stroke="var(--stripe)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- ojos dormidos -->
        <g class="eyes-sleep" stroke="#2b1d14" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M54 86 q8 7 16 0"/>
          <path d="M90 86 q8 7 16 0"/>
        </g>
        <!-- ojos despiertos -->
        <g class="eyes-awake">
          <ellipse cx="62" cy="86" rx="8" ry="10" fill="#2b1d14"/>
          <ellipse cx="98" cy="86" rx="8" ry="10" fill="#2b1d14"/>
          <circle cx="65" cy="82" r="2.8" fill="#fff"/>
          <circle cx="101" cy="82" r="2.8" fill="#fff"/>
        </g>
        <path d="M75 98 h10 l-5 6 Z" fill="#E77A8A"/>
        <path d="M80 104 q-6 8 -13 3 M80 104 q6 8 13 3" stroke="#2b1d14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M40 96 h-22 M40 102 l-20 6 M120 96 h22 M120 102 l20 6" stroke="#2b1d14" stroke-width="2" stroke-linecap="round"/>
        <text class="zzz" x="128" y="34">z</text>
        <text class="zzz z2" x="140" y="20">z</text>
      </svg>
      <p id="status" class="status">Durmiendo…</p>
      <button id="toggle" class="toggle" type="button">Despertar al gatito</button>
      <p class="count"><span id="count">0</span> pestañas cazadas</p>
    </section>

    <section class="sites">
      <h2>Sitios prohibidos</h2>
      <form id="add-form" class="add">
        <input id="site-input" type="text" placeholder="ej. youtube.com" autocomplete="off" spellcheck="false">
        <button type="submit">Agregar</button>
      </form>
      <ul id="site-list"></ul>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
