<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>NoScroll</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section class="hero">
      <div class="stage">
        <svg id="ball" class="ball" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="p-body" cx="38%" cy="30%" r="78%">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".42" stop-color="#f1f2f5"/>
              <stop offset=".78" stop-color="#cdd1da"/>
              <stop offset="1" stop-color="#9ea4b1"/>
            </radialGradient>
            <radialGradient id="p-ao" cx="50%" cy="100%" r="62%">
              <stop offset="0" stop-color="#4a5060" stop-opacity=".32"/>
              <stop offset="1" stop-color="#4a5060" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="p-shine" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="92" fill="url(#p-body)"/>
          <circle cx="100" cy="100" r="92" fill="url(#p-ao)"/>
          <ellipse cx="66" cy="50" rx="36" ry="20" transform="rotate(-30 66 50)" fill="url(#p-shine)"/>
          <!-- ojos dormidos -->
          <g class="eyes-sleep" stroke="#121216" stroke-width="7" stroke-linecap="round" fill="none">
            <path d="M68 104 q12 9 24 0"/>
            <path d="M108 104 q12 9 24 0"/>
          </g>
          <!-- ojos despiertos (siguen al mouse) -->
          <g id="eyes" class="eyes-awake">
            <g class="eyes-inner">
              <rect x="70" y="72" width="20" height="50" rx="10" transform="rotate(8 80 97)" fill="#121216"/>
              <rect x="110" y="72" width="20" height="50" rx="10" transform="rotate(-8 120 97)" fill="#121216"/>
              <ellipse cx="81" cy="82" rx="4" ry="6" transform="rotate(8 80 97)" fill="#fff" opacity=".55"/>
              <ellipse cx="121" cy="82" rx="4" ry="6" transform="rotate(-8 120 97)" fill="#fff" opacity=".55"/>
            </g>
          </g>
        </svg>
        <span class="zzz">z</span><span class="zzz z2">z</span>
        <div class="shadow"></div>
      </div>
      <p id="status" class="status">Durmiendo</p>
      <button id="toggle" class="toggle" type="button">Activar</button>
      <p class="count"><span id="count">0</span> pestañas cerradas</p>
    </section>

    <section class="sites">
      <h2>Sitios prohibidos</h2>
      <form id="add-form" class="add">
        <input id="site-input" type="text" placeholder="ej. youtube.com" autocomplete="off" spellcheck="false">
        <button type="submit">Agregar</button>
      </form>
      <ul id="site-list"></ul>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
